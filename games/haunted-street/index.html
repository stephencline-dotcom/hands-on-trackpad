<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Haunted Street | Hands-On Trackpad</title>

    <link
      rel="stylesheet"
      href="../moving-sound-mini-game/styles.css"
    />
    <link
      rel="stylesheet"
      href="../../level-result.css"
    />
    <link
      rel="stylesheet"
      href="../../freeze-screen.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body
    class="haunted-street-page"
    data-game-active-key="hauntedStreetGameActive"
  >
    <main class="shell game-shell haunted-street-shell">
      <header class="panel game-header">
        <div class="copy game-heading">
          <p class="eyebrow game-category">Mini Game</p>
          <h1 class="game-title">Haunted Street</h1>
        </div>

        <div class="game-header-controls">
          <a
            class="back-button game-header-button"
            href="../../index.html"
            aria-label="Home"
            title="Home"
          >
            <img
              class="home-btn-icon"
              src="../../images/home-icon.svg"
              alt=""
              aria-hidden="true"
            />
          </a>

          <button
            id="hauntedSoundButton"
            class="sound-toggle-button game-header-button"
            type="button"
            aria-pressed="false"
            aria-label="Sound on"
            title="Sound on"
          >
            🔊
          </button>
        </div>
      </header>

      <p
        id="hauntedInstructions"
        class="description game-instructions"
      >
        Move along the street and throw jack-o'-lanterns at
        the bats and witches.
      </p>

      <section class="hud game-stats" aria-live="polite">
        <div
          class="hud-main-stats game-stats-row"
          role="group"
          aria-label="Game statistics"
        >
          <div class="stat game-stat">
            <span class="label">Level</span>
            <span id="hauntedLevel" class="value">1</span>
          </div>

          <div class="stat game-stat">
            <span class="label">Goal</span>
            <span id="hauntedGoal" class="value">0/0</span>
          </div>

          <div class="stat game-stat">
            <span class="label">Lives</span>
            <span id="hauntedLives" class="value">3</span>
          </div>

          <div class="stat game-stat">
            <span class="label">Score</span>
            <span id="hauntedScore" class="value">0</span>
          </div>

          <div class="stat game-stat">
            <span class="label">Control</span>
            <span id="hauntedControlMode" class="value">
              Slide
            </span>
          </div>

          <div class="stat game-stat">
            <span class="label">Throw</span>
            <span id="hauntedThrowMode" class="value">
              Auto
            </span>
          </div>
        </div>
      </section>

      <section class="arena-wrap game-stage-wrap">
        <div class="arena-frame game-stage">
          <div
            id="hauntedArena"
            class="haunted-arena"
            aria-label="Haunted Street game area"
            role="application"
          >
            <canvas
              id="hauntedCanvas"
              width="1200"
              height="660"
              aria-label="A Halloween street with a haunted house, bats, witches, and a child throwing jack-o'-lanterns"
            ></canvas>

            <div
              id="hauntedStartPanel"
              class="haunted-start-panel"
            >
              <p id="hauntedStatus" class="haunted-status">
                Level 1 ready.
              </p>

              <button
                id="hauntedStartButton"
                class="haunted-start-button"
                type="button"
              >
                Start Level 1
              </button>
            </div>
          </div>
        </div>
      </section>

      <section
        class="imported-trackpad-guide game-guide"
        aria-label="Trackpad Guide"
      >
        <p class="imported-trackpad-guide-label">
          Trackpad Guide
        </p>

        <p
          id="hauntedGuideInstruction"
          class="haunted-guide-instruction"
        >
          Slide one finger to move.
        </p>

        <section
          id="hauntedTrackpadScene"
          class="imported-trackpad-scene"
          aria-label="Trackpad guide animation"
        >
          <img
            class="imported-trackpad-image"
            src="../../images/trackpad.png"
            alt="Trackpad"
            draggable="false"
          />

          <img
            id="hauntedTrackpadLeftHand"
            class="imported-trackpad-hand imported-trackpad-left-hand"
            src="../../images/left-hand-transparent.png"
            alt="Left hand"
            draggable="false"
          />

          <img
            id="hauntedTrackpadRightHand"
            class="imported-trackpad-hand imported-trackpad-right-hand"
            src="../../images/right-hand-transparent.png"
            alt="Right hand"
            draggable="false"
          />

          <div
            id="hauntedTrackpadPressIndicator"
            class="imported-trackpad-press-indicator"
            aria-hidden="true"
          ></div>
        </section>
      </section>
    </main>

    <script src="../../game-access.js"></script>
    <script src="../../movement-mode.js"></script>
    <script src="../../trackpad-guide.js"></script>
    <script src="../../trackpad-guide-setting.js"></script>
    <script src="../../level-result.js"></script>
    <script src="../../game-results-store.js"></script>
    <script src="../../freeze-screen.js"></script>
    <script src="../../input-device-guard.js"></script>
    <script src="script.js"></script>
  </body>
</html>
