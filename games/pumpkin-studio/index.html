<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pumpkin Patch Studio · Hands-On Trackpad</title><link rel="stylesheet" href="../moving-sound-mini-game/styles.css"><link rel="stylesheet" href="../../freeze-screen.css"><link rel="stylesheet" href="style.css?v=2"></head>
<body data-game-active-key="pumpkinStudioGameActive"><main class="studio"><header><div><small>CREATE SOMETHING BOO-TIFUL</small><h1>Pumpkin Patch Studio</h1></div><nav><a href="../../index.html">Home</a><button id="help">Help</button><button id="sound" aria-pressed="true">Sound on</button><label><input type="checkbox" id="voice" checked>Voice</label></nav></header><p id="message" role="status" aria-live="polite">Choose a pumpkin, then make it your own!</p>
<div class="workspace"><nav id="categories" aria-label="Picture choices"></nav><section class="choice-tray" aria-label="Design pieces"><div id="palette"></div><div id="shapeChoices" hidden><span>Pumpkin shape</span><button data-shape="0" aria-label="Round pumpkin">Round</button><button data-shape="1" aria-label="Tall pumpkin">Tall</button><button data-shape="2" aria-label="Wide pumpkin">Wide</button><button data-shape="3" aria-label="Little pumpkin">Little</button></div></section><section id="stage"><canvas id="arena" width="1000" height="600" tabindex="0" aria-label="Your pumpkin. Touch a face piece with the pointer to pick it up, then click to set it down. Arrow keys move the selected piece. Escape cancels moving."></canvas><div id="welcome"><div><small>YOUR PUMPKIN. YOUR IDEAS.</small><h2>What will you make?</h2><p>Pick a pumpkin. Give it a face.<br>Add a little autumn magic!</p><button id="start" disabled>Loading teacher settings…</button></div></div></section><aside class="imported-trackpad-guide"><p class="imported-trackpad-guide-label">Trackpad Guide</p><section id="handScene" class="imported-trackpad-scene"><img class="imported-trackpad-image" src="../../images/trackpad.png" alt="Trackpad" draggable="false"><img id="leftHand" class="imported-trackpad-hand imported-trackpad-left-hand" src="../../images/left-hand-transparent.png" alt="Left hand" draggable="false"><img id="rightHand" class="imported-trackpad-hand imported-trackpad-right-hand" src="../../images/right-hand-transparent.png" alt="Right hand" draggable="false"><div id="press" class="imported-trackpad-press-indicator"></div></section><p id="inputHint">Click a picture to add it.</p></aside></div>

<footer><div class="edit-tools" aria-label="Edit selected piece"><button id="undo" disabled title="Undo last change">↶ Undo</button><button id="smaller" disabled aria-label="Make selected piece smaller">−</button><button id="bigger" disabled aria-label="Make selected piece bigger">+</button><button id="turn" disabled aria-label="Turn selected piece">↻</button><button id="remove" disabled aria-label="Remove selected piece">✕</button></div><div class="finish-tools"><button id="new">New pumpkin</button><button id="glow" aria-pressed="false">✦ Light it up!</button><button id="save">▣ Save picture</button></div></footer></main>
