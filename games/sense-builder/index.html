<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Sense Builder | Hands-On Trackpad</title>

  <link
    rel="stylesheet"
    href="../moving-sound-mini-game/styles.css"
  />

  <link
    rel="stylesheet"
    href="../../level-result.css"
  />

  <link
    rel="stylesheet"
    href="style.css"
  />

  <link
    rel="stylesheet"
    href="../../freeze-screen.css"
  />
</head>

<body
  class="sense-builder-page"
  data-game-active-key="senseBuilderGameActive"
>
  <main class="shell game-shell sense-builder-shell">

    <header class="panel game-header">
      <div class="copy game-heading">
        <p class="eyebrow game-category">
          Mini Game
        </p>

        <h1 class="game-title">
          Sense Builder
        </h1>
      </div>

      <div class="game-header-controls">
        <a
          class="back-button game-header-button"
          href="../../index.html"
          aria-label="Home"
          title="Home"
        >
          <img
            class="home-btn-icon"
            src="../../images/home-icon.svg"
            alt=""
            aria-hidden="true"
          />
        </a>

        <button
          id="senseSoundButton"
          class="sound-toggle-button game-header-button"
          type="button"
          aria-pressed="false"
          aria-label="Sound on"
          title="Sound on"
        >
          🔊
        </button>
      </div>
    </header>

    <div class="sense-top-row">
      <p
        id="senseInstruction"
        class="description game-instructions"
      >
        Drag each picture to its match.
      </p>
  
      <section
        class="hud game-stats"
        aria-live="polite"
      >
        <div
          class="hud-main-stats game-stats-row"
          role="group"
          aria-label="Game progress"
        >
          <div class="stat game-stat">
            <span class="label">Round</span>
            <span class="value" id="senseRound">1</span>
          </div>
  
          <div class="stat game-stat">
            <span class="label">Matches</span>
            <span class="value" id="senseMatches">0/7</span>
          </div>
  
          <div class="stat game-stat">
            <span class="label">Tries</span>
            <span class="value" id="senseTries">0</span>
          </div>
        </div>
      </section>
    </div>

    <section class="arena-wrap game-stage-wrap">
      <div class="arena-frame game-stage">

        <div
          id="senseArena"
          class="sense-arena"
          role="application"
          aria-label="Five senses matching game"
        >
          <div
            id="sensePrompt"
            class="sense-picture-prompt"
            aria-live="polite"
          >
            <span aria-hidden="true">☝️</span>
            <strong>DRAG</strong>
          </div>

          <div
            id="senseBoard"
            class="sense-board"
          >
            <section
              id="sensePersonArea"
              class="sense-person-area"
              aria-label="Person matching area"
            >
              
                <section
                  id="senseMonsterStage"
                  class="sense-monster-stage"
                  aria-label="Sense Monsters"
                >
                  <div
                    class="sense-drop-zone sense-monster-card sense-eye-monster"
                    data-match="sight"
                    aria-label="Eye monster"
                  >
                    <span class="monster-horns">▲ ▲</span>
                    <span class="monster-feature">👁️ 👁️ 👁️</span>
                    <span class="monster-smile">◡</span>
                    <span class="sense-monster-food-slot"></span>
                  </div>

                  <div
                    class="sense-drop-zone sense-monster-card sense-ear-monster"
                    data-match="hearing"
                    aria-label="Ear monster"
                  >
                    <span class="monster-side-feature">👂 👂</span>
                    <span class="monster-face">• ◡ •</span>
                    <span class="sense-monster-food-slot"></span>
                  </div>

                  <div
                    class="sense-drop-zone sense-monster-card sense-nose-monster"
                    data-match="smell"
                    aria-label="Nose monster"
                  >
                    <span class="monster-horns">● ●</span>
                    <span class="monster-feature">👃</span>
                    <span class="monster-sniff">〰 〰</span>
                    <span class="sense-monster-food-slot"></span>
                  </div>

                  <div
                    class="sense-drop-zone sense-monster-card sense-mouth-monster"
                    data-match="taste"
                    aria-label="Mouth monster"
                  >
                    <span class="monster-eyes">● ●</span>
                    <span class="monster-feature">👄</span>
                    <span class="monster-teeth">▴ ▴ ▴</span>
                    <span class="sense-monster-food-slot"></span>
                  </div>

                  <div
                    class="sense-drop-zone sense-monster-card sense-hand-monster"
                    data-match="touch"
                    aria-label="Hand monster"
                  >
                    <span class="monster-hands">🖐️ 🖐️</span>
                    <span class="monster-face">• ◡ •</span>
                    <span class="sense-monster-food-slot"></span>
                  </div>
                </section>

<div
                id="sensePerson"
                class="sense-person"
                aria-hidden="true"
              >
                <div class="sense-head">
                  <div
                    class="sense-drop-zone sense-eyes-zone"
                    data-match="eyes"
                  ></div>

                  <div
                    class="sense-drop-zone sense-left-ear-zone"
                    data-match="left-ear"
                  ></div>

                  <div
                    class="sense-drop-zone sense-right-ear-zone"
                    data-match="right-ear"
                  ></div>

                  <div
                    class="sense-drop-zone sense-nose-zone"
                    data-match="nose"
                  ></div>

                  <div
                    class="sense-drop-zone sense-mouth-zone"
                    data-match="mouth"
                  ></div>
                </div>

                <div class="sense-body">
                  <div
                    class="sense-drop-zone sense-left-hand-zone"
                    data-match="left-hand"
                  ></div>

                  <div
                    class="sense-drop-zone sense-right-hand-zone"
                    data-match="right-hand"
                  ></div>
                </div>
              </div>
            </section>

            <section
              id="sensePieceTray"
              class="sense-piece-tray"
              aria-label="Pieces to match"
            >
              <button
                class="sense-piece"
                type="button"
                data-piece="eyes"
                aria-label="Eyes"
              >
                <span aria-hidden="true">👀</span>
              </button>

              <button
                class="sense-piece"
                type="button"
                data-piece="left-ear"
                aria-label="Left ear"
              >
                <span
                  class="sense-mirrored-picture"
                  aria-hidden="true"
                >
                  👂
                </span>
              </button>

              <button
                class="sense-piece"
                type="button"
                data-piece="right-ear"
                aria-label="Right ear"
              >
                <span aria-hidden="true">👂</span>
              </button>

              <button
                class="sense-piece"
                type="button"
                data-piece="nose"
                aria-label="Nose"
              >
                <span aria-hidden="true">👃</span>
              </button>

              <button
                class="sense-piece"
                type="button"
                data-piece="mouth"
                aria-label="Mouth"
              >
                <span aria-hidden="true">👄</span>
              </button>

              <button
                class="sense-piece"
                type="button"
                data-piece="left-hand"
                aria-label="Left hand"
              >
                <span
                  class="sense-mirrored-picture"
                  aria-hidden="true"
                >
                  ✋
                </span>
              </button>

              <button
                class="sense-piece"
                type="button"
                data-piece="right-hand"
                aria-label="Right hand"
              >
                <span aria-hidden="true">✋</span>
              </button>
            </section>
          </div>

          <button
            id="senseStartButton"
            class="sense-start-button"
            type="button"
          >
            PLAY
          </button>

          <div
            id="senseFeedback"
            class="sense-feedback"
            role="status"
            aria-live="polite"
          ></div>

          <section
            id="senseRescueArena"
            class="sense-rescue-arena"
            aria-label="Five Senses Rescue"
            hidden
          >
            <div class="sense-rescue-sky" aria-hidden="true">
              <div class="sense-rescue-cloud sense-rescue-cloud-one"></div>
              <div class="sense-rescue-cloud sense-rescue-cloud-two"></div>
              <div class="sense-rescue-cloud sense-rescue-cloud-three"></div>
            </div>

            <div class="sense-rescue-hills" aria-hidden="true"></div>
            <div class="sense-rescue-ground" aria-hidden="true"></div>

            <div class="sense-rescue-hud">
              <div class="sense-rescue-target">
                <span
                  id="senseRescueTargetIcon"
                  class="sense-rescue-target-icon"
                  aria-hidden="true"
                >👀</span>

                <span
                  id="senseRescueTargetLabel"
                  class="sense-rescue-target-label"
                >SIGHT</span>
              </div>

              <div
                id="senseRescueHearts"
                class="sense-rescue-hearts"
                aria-label="3 lives"
              >❤️ ❤️ ❤️</div>

              <div class="sense-rescue-score-wrap">
                <span class="sense-rescue-score-label">SCORE</span>
                <span
                  id="senseRescueScore"
                  class="sense-rescue-score"
                >0</span>
              </div>
            </div>

            <div
              id="senseRescuePlayfield"
              class="sense-rescue-playfield"
            >
              <div class="sense-rescue-far-town" aria-hidden="true"></div>
              <div class="sense-rescue-midtown" aria-hidden="true"></div>
              <div class="sense-rescue-tree-line" aria-hidden="true"></div>
              <div class="sense-rescue-fence" aria-hidden="true"></div>

              <div
                id="senseRescueHero"
                class="sense-rescue-hero"
                data-character="boy"
                aria-label="Player"
              >
                <div class="sense-rescue-hero-shadow"></div>

                <div class="sense-rescue-hero-character">
                  <div class="sense-rescue-hero-head"></div>
                  <div class="sense-rescue-hero-body"></div>
                  <div class="sense-rescue-hero-arm sense-rescue-hero-arm-left"></div>
                  <div class="sense-rescue-hero-arm sense-rescue-hero-arm-right"></div>
                  <div class="sense-rescue-hero-leg sense-rescue-hero-leg-left"></div>
                  <div class="sense-rescue-hero-leg sense-rescue-hero-leg-right"></div>
                </div>
              </div>
            </div>

            <div
              id="senseRescueTransition"
              class="sense-rescue-transition"
              hidden
            >
              <div class="sense-rescue-transition-card">
                <div class="sense-rescue-transition-stars" aria-hidden="true">
                  ✨ ⭐ ✨
                </div>

                <h2>TRAINING COMPLETE!</h2>
                <p>FIVE SENSES RESCUE</p>

                <button
                  id="senseRescueStartButton"
                  class="sense-rescue-start-button"
                  type="button"
                >
                  START RESCUE!
                </button>
              </div>
            </div>
          </section>
        </div>

      </div>
    </section>

    <section
      class="imported-trackpad-guide game-guide"
      aria-label="Trackpad Guide"
    >
      <p class="imported-trackpad-guide-label">
        Trackpad Guide
      </p>

      <section
        id="senseTrackpadScene"
        class="imported-trackpad-scene"
        aria-label="Trackpad guide animation"
      >
        <img
          class="imported-trackpad-image"
          src="../../images/trackpad.png"
          alt="Trackpad"
          draggable="false"
        />

        <img
          id="senseTrackpadLeftHand"
          class="imported-trackpad-hand imported-trackpad-left-hand"
          src="../../images/left-hand-transparent.png"
          alt="Left hand"
          draggable="false"
        />

        <img
          id="senseTrackpadRightHand"
          class="imported-trackpad-hand imported-trackpad-right-hand"
          src="../../images/right-hand-transparent.png"
          alt="Right hand"
          draggable="false"
        />

        <div
          class="imported-trackpad-press-indicator"
          aria-hidden="true"
        ></div>
      </section>
    </section>

  </main>

  <script src="../../game-access.js"></script>
  <script src="../../trackpad-guide.js"></script>
  <script src="../../level-result.js"></script>
  <script src="../../game-results-store.js"></script>
  <script src="../../freeze-screen.js"></script>
  <script src="../../input-device-guard.js"></script>
  <script src="script.js"></script>
</body>
</html>
